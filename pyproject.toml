[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-agent"
version = "0.1.0"
description = "Read-only US stock and ETF research MVP"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.40.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "ollama>=0.4.7",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
trading-research = "trading_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
